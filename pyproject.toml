[project]
name = "sr-electricals"
version = "0.1.0"
description = "Shop website for SR Electrical, Deoghar: brands, catalogue, WhatsApp quote list and owner admin."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/studio_auth.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI declares File()/Form() in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # test docstrings quote the acceptance criteria in full
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
